apiVersion: apps/v1
kind: Deployment
metadata:
  name: dexter-frontend
  labels:
    app: dexter
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dexter
      component: frontend
  template:
    metadata:
      labels:
        app: dexter
        component: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/your-org/dexter-frontend:FRONTEND_VERSION
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dexter-frontend
  labels:
    app: dexter
    component: frontend
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: dexter
    component: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dexter-frontend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://api.your-domain.com https://*.sentry.io; img-src 'self' data:; style-src 'self' 'unsafe-inline';" always;
spec:
  tls:
  - hosts:
    - your-domain.com
    - www.your-domain.com
    secretName: dexter-frontend-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dexter-frontend
            port:
              number: 80
  - host: www.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dexter-frontend
            port:
              number: 80