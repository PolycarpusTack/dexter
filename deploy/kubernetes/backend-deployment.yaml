apiVersion: apps/v1
kind: Deployment
metadata:
  name: dexter-backend
  labels:
    app: dexter
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dexter
      component: backend
  template:
    metadata:
      labels:
        app: dexter
        component: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/your-org/dexter-backend:BACKEND_VERSION
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        env:
          - name: PORT
            value: "8000"
          - name: HOST
            value: "0.0.0.0"
          - name: DEBUG
            value: "false"
          - name: SENTRY_ORGANIZATION_SLUG
            valueFrom:
              secretKeyRef:
                name: dexter-secrets
                key: sentry_organization_slug
          - name: SENTRY_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: dexter-secrets
                key: sentry_api_token
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: dexter-secrets
                key: secret_key
          - name: CORS_ORIGINS
            value: '["https://dexter.your-domain.com"]'
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dexter-backend
  labels:
    app: dexter
    component: backend
spec:
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: dexter
    component: backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dexter-backend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - api.your-domain.com
    secretName: dexter-backend-tls
  rules:
  - host: api.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dexter-backend
            port:
              number: 80