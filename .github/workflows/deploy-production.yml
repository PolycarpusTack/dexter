# GitHub Actions workflow for deploying Dexter to production
name: Deploy to Production

# Only run on releases
on:
  release:
    types: [published]

# Define environment variables
env:
  BACKEND_IMAGE: dexter-backend
  FRONTEND_IMAGE: dexter-frontend
  ECR_REPOSITORY: dexter
  AWS_REGION: us-west-2

# Define job environments
jobs:
  # Build and push backend image
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up QEMU for multi-architecture builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build and push frontend image
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up QEMU for multi-architecture builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Create .env.production file
      - name: Create .env.production
        run: |
          cat > ./frontend/.env.production << EOF
          VITE_API_BASE_URL=${{ secrets.PROD_API_URL }}
          VITE_APP_MODE=production
          VITE_APP_VERSION=${{ github.ref_name }}
          VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          EOF

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to AWS ECS
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      # Add version to deployment manifest
      - name: Update deployment version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          sed -i "s/BACKEND_VERSION/$VERSION/g" deploy/kubernetes/backend-deployment.yaml
          sed -i "s/FRONTEND_VERSION/$VERSION/g" deploy/kubernetes/frontend-deployment.yaml
      
      # Deploy backend to ECS
      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: deploy/aws/backend-task-definition.json
          service: dexter-backend
          cluster: dexter-cluster
          wait-for-service-stability: true
      
      # Deploy frontend to ECS
      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: deploy/aws/frontend-task-definition.json
          service: dexter-frontend
          cluster: dexter-cluster
          wait-for-service-stability: true
      
      # Run post-deployment checks
      - name: Run post-deployment checks
        run: |
          # Wait for services to be available
          sleep 30
          
          # Check backend health
          curl -f ${{ secrets.PROD_API_URL }}/health || exit 1
          
          # Check frontend
          curl -f https://${{ secrets.PROD_DOMAIN }} || exit 1
      
      # Create deployment notification
      - name: Create deployment notification
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: 'deployments'
          slack-message: "🚀 Dexter v${{ github.ref_name }} has been deployed to production. <https://${{ secrets.PROD_DOMAIN }}|View site>"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}